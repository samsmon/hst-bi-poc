# One service: the Go server with the embedded web app. PostgreSQL is NOT part
# of this file; it is the shared instance on the host. Secrets come from .env
# (never committed).
services:
  hst-bi:
    build: .
    restart: unless-stopped
    environment:
      BI_ALLOWED_SCHEMAS: ${BI_ALLOWED_SCHEMAS:-public,ml}
      # Wired in P4: DATABASE_URL with the bi_reader role.
    ports:
      # Bind to the Tailscale or loopback address only, never 0.0.0.0.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8610}:8610"
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
