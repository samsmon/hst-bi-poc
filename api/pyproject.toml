[project]
name = "hst-bi-api"
version = "0.1.0"
description = "Read-only BI API for the HST dataset"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlglot>=30,<31",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.setuptools]
packages = ["app"]
